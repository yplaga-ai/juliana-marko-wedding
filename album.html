<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Juliana & Marko — Private Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Sacramento&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#FCF9F2;--ink:#413F3A;--ink-soft:#6f6a60;--sage:#8A9A6B;--sage-deep:#6f7f52;--rust:#C96A2B;--rust-deep:#a9531c;--rule:#c97b3f;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;-webkit-font-smoothing:antialiased;}
  header{text-align:center;padding:40px 20px 10px;}
  .accent{display:block;width:190px;height:auto;margin:0 auto 4px;}
  h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:3.2rem;margin:.1rem 0;color:var(--ink);}
  .sub{text-transform:uppercase;letter-spacing:.22em;font-size:.75rem;color:var(--ink-soft);margin-bottom:6px;}
  .rule{height:1px;background:var(--rule);opacity:.5;border:0;max-width:900px;margin:18px auto;}

  /* login */
  .gate{max-width:400px;margin:30px auto;background:#fff;border:1px solid rgba(201,106,43,.22);border-radius:8px;padding:34px 28px;text-align:center;box-shadow:0 10px 30px -20px rgba(80,60,30,.4);}
  .lock{font-size:2rem;}
  .gate p{color:var(--ink-soft);font-size:.95rem;}
  .gate input{font-family:inherit;font-size:1rem;padding:.7rem 1rem;width:100%;border:1px solid var(--sage);border-radius:4px;text-align:center;letter-spacing:.08em;margin-top:6px;}
  .gate button{margin-top:14px;width:100%;padding:.7rem;border:0;border-radius:4px;cursor:pointer;background:var(--rust);color:#fff;text-transform:uppercase;letter-spacing:.2em;font-size:.75rem;}
  .gate button:hover{background:var(--rust-deep);}
  .gate button:disabled{opacity:.6;cursor:default;}
  .err{color:#b5481f;font-size:.85rem;margin-top:12px;min-height:1.1em;}

  /* gallery */
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px;}
  .bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:6px 0 18px;}
  .count{text-transform:uppercase;letter-spacing:.16em;font-size:.8rem;color:var(--ink-soft);}
  .refresh{cursor:pointer;border:1px solid var(--rust);color:var(--rust);background:none;border-radius:3px;padding:.4rem 1rem;text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;}
  .refresh:hover{background:var(--rust);color:#fff;}
  .bar-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn-primary{cursor:pointer;border:1px solid var(--rust);background:var(--rust);color:#fff;border-radius:3px;padding:.4rem 1rem;text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;}
  .btn-primary:hover{background:var(--rust-deep);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .dlprogress{text-align:right;font-size:.82rem;color:var(--sage-deep);min-height:1.1em;margin:-6px 0 16px;font-style:italic;}
  .tile{position:relative;display:block;border-radius:6px;overflow:hidden;background:#f0eadd;aspect-ratio:1;border:1px solid rgba(0,0,0,.05);cursor:pointer;}
  .tile-media{width:100%;height:100%;object-fit:cover;display:block;}
  .tile .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none;}
  .tile-dl{position:absolute;right:7px;bottom:7px;border:0;border-radius:50%;width:32px;height:32px;background:rgba(0,0,0,.55);color:#fff;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;}
  .tile-dl:hover{background:var(--rust);}
  .tile-check{position:absolute;left:7px;top:7px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.88);border:2px solid var(--rust);color:transparent;display:none;align-items:center;justify-content:center;font-size:.8rem;font-weight:bold;}
  .grid.selectmode .tile-check{display:flex;}
  .grid.selectmode .tile-dl{display:none;}
  .tile.selected .tile-check{background:var(--rust);color:#fff;}
  .tile.selected{outline:3px solid var(--rust);outline-offset:-3px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .grid a,.grid .vwrap{position:relative;display:block;border-radius:6px;overflow:hidden;background:#f0eadd;aspect-ratio:1;border:1px solid rgba(0,0,0,.05);}
  .grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block;}
  .grid .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none;}
  .empty{text-align:center;color:var(--ink-soft);padding:50px 0;font-style:italic;}
  footer{text-align:center;color:var(--ink-soft);font-size:.8rem;padding:30px 0;}
  .hidden{display:none;}

  /* well wishes */
  .sec-h{font-family:"Sacramento",cursive;font-weight:400;font-size:2.2rem;color:var(--rust);margin:24px 0 14px;text-align:center;}
  .sec-n{font-family:"Cormorant Garamond",serif;font-size:.95rem;color:var(--ink-soft);letter-spacing:.08em;}
  .wishes-sec{margin-bottom:26px;}
  .wishes-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .wish-card{background:#fff;border:1px solid rgba(201,106,43,.18);border-radius:10px;padding:18px;box-shadow:0 8px 24px -18px rgba(80,60,30,.45);}
  .wish-card .from{font-family:"Great Vibes",cursive;font-size:1.7rem;color:var(--ink);line-height:1.1;}
  .wish-card .when{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;margin:2px 0 12px;}
  .wish-card .msg{white-space:pre-wrap;font-size:1.02rem;line-height:1.5;color:var(--ink);margin:0 0 12px;}
  .wish-card video,.wish-card img{width:100%;border-radius:8px;background:#000;display:block;}
  .wish-card .dl{display:inline-block;margin-top:8px;font-size:.72rem;letter-spacing:.06em;color:var(--sage-deep);text-decoration:none;}
  .wish-card .dl:hover{text-decoration:underline;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

  <div class="sub">Private Album</div>
  <h1>Juliana & Marko</h1>
  <div class="sub" style="letter-spacing:.16em">every photo your guests share</div>
</header>
<hr class="rule" />

<div id="login" class="gate">
  <div class="lock">&#128274;</div>
  <p>Enter your album password, Juliana.</p>
  <input type="password" id="pw" placeholder="Album password" autocomplete="current-password" />
  <button id="go">View the album</button>
  <div class="err" id="err"></div>
</div>

<div id="gallery" class="wrap hidden">
  <div class="bar">
    <div class="count" id="count"></div>
    <div class="bar-actions">
      <button class="btn-primary" id="downloadAll">&#11015; Download everything</button>
      <button class="btn-primary" id="downloadSelected" style="display:none" disabled>&#11015; Download selected (0)</button>
      <button class="refresh" id="selectToggle">Select</button>
      <button class="refresh" id="refresh">Refresh</button>
    </div>
  </div>
  <div class="dlprogress" id="dlprogress"></div>

  <section id="wishesSec" class="wishes-sec hidden">
    <h2 class="sec-h">Well Wishes <span class="sec-n" id="wishesCount"></span></h2>
    <div class="wishes-list" id="wishesList"></div>
  </section>

  <h2 class="sec-h" id="photosH">Photos &amp; Videos</h2>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty">No photos yet — they'll appear here as guests share them.</div>
</div>

<footer>Juliana &amp; Marko &nbsp;&bull;&nbsp; 17 . 10 . 2026</footer>

<script>
  const WORKER = "https://juliana-marko-photos.xanivarcloud.workers.dev";
  let PW = "";
  let ALL_PHOTOS = [], ALL_WISHES = [], selectMode = false;
  const selected = new Set();
  const $ = id => document.getElementById(id);
  const isVideo = k => /\.(mp4|mov|webm|m4v|avi|3gp)$/i.test(k);

  async function loadAlbum(){
    const r = await fetch(WORKER + "/list?pw=" + encodeURIComponent(PW));
    if(r.status === 401) throw new Error("unauthorized");
    if(!r.ok) throw new Error("Something went wrong (" + r.status + ")");
    const data = await r.json();
    render(data.items || []);
    try { await loadWishes(); } catch(e) { /* wishes are optional; don't block the album */ }
  }

  async function loadWishes(){
    const r = await fetch(WORKER + "/wishes?pw=" + encodeURIComponent(PW));
    if(!r.ok) return;
    const data = await r.json();
    renderWishes(data.items || []);
  }

  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(ts){ const d=new Date(ts); if(isNaN(d)) return ""; try{ return d.toLocaleString('en-AU',{timeZone:'Australia/Melbourne',dateStyle:'medium',timeStyle:'short'}); }catch(e){ return d.toLocaleString(); } }

  function renderWishes(items){
    ALL_WISHES = items || [];
    const sec = $("wishesSec"), list = $("wishesList");
    $("wishesCount").textContent = items.length ? ("(" + items.length + ")") : "";
    list.innerHTML = "";
    if(!items.length){ sec.classList.add("hidden"); return; }
    sec.classList.remove("hidden");
    for(const it of items){
      const card = document.createElement("div"); card.className = "wish-card";
      let html = '<div class="from">' + esc(it.name || "A guest") + '</div>' +
                 '<div class="when">' + esc(fmtDate(it.ts)) + '</div>';
      if(it.message){ html += '<div class="msg">' + esc(it.message) + '</div>'; }
      card.innerHTML = html;
      if(it.mediaKey){
        const url = fileUrl(it.mediaKey);
        if(/^video\//.test(it.mediaType || "") || isVideo(it.mediaKey)){
          const v = document.createElement("video"); v.src = url; v.controls = true; v.preload = "metadata"; v.setAttribute("playsinline","");
          card.appendChild(v);
        } else {
          const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
          const img = document.createElement("img"); img.loading = "lazy"; img.src = url; img.alt = "";
          a.appendChild(img); card.appendChild(a);
        }
        const dl = document.createElement("a"); dl.className = "dl"; dl.href = url; dl.setAttribute("download",""); dl.target = "_blank"; dl.rel = "noopener"; dl.textContent = "Download";
        card.appendChild(dl);
      }
      list.appendChild(card);
    }
  }

  function fileUrl(key){ return WORKER + "/file/" + key + "?pw=" + encodeURIComponent(PW); }

  function render(items){
    ALL_PHOTOS = items || [];
    selected.clear();
    $("login").classList.add("hidden");
    $("gallery").classList.remove("hidden");
    $("count").textContent = items.length + (items.length === 1 ? " photo" : " photos");
    const grid = $("grid");
    grid.innerHTML = "";
    $("empty").classList.toggle("hidden", items.length > 0);
    for(const it of items){
      const key = it.key, url = fileUrl(key);
      const tile = document.createElement("div"); tile.className = "tile";
      if(isVideo(key)){
        const v = document.createElement("video"); v.src = url; v.muted = true; v.preload = "metadata"; v.className = "tile-media";
        const p = document.createElement("div"); p.className = "play"; p.textContent = "\u25B6";
        tile.appendChild(v); tile.appendChild(p);
      } else {
        const img = document.createElement("img"); img.loading = "lazy"; img.src = url; img.alt = ""; img.className = "tile-media";
        tile.appendChild(img);
      }
      const chk = document.createElement("div"); chk.className = "tile-check"; chk.innerHTML = "&#10003;";
      tile.appendChild(chk);
      const dlb = document.createElement("button"); dlb.className = "tile-dl"; dlb.title = "Download this one"; dlb.innerHTML = "&#11015;";
      dlb.addEventListener("click", (e) => { e.stopPropagation(); downloadOne(key); });
      tile.appendChild(dlb);
      tile.addEventListener("click", () => { if(selectMode){ toggleItem(key, tile); } else { window.open(url, "_blank"); } });
      grid.appendChild(tile);
    }
  }

  async function attempt(){
    const val = $("pw").value.trim();
    if(!val) return;
    PW = val;
    $("go").disabled = true; $("go").textContent = "Opening…"; $("err").textContent = "";
    try{ await loadAlbum(); }
    catch(e){
      if(String(e.message) === "unauthorized"){ $("err").textContent = "That password isn't right — try again."; }
      else { $("err").textContent = e.message; }
      PW = "";
    }
    finally{ $("go").disabled = false; $("go").textContent = "View the album"; }
  }

  function sanitizeName(s){ return (s||"").replace(/[^\w.\- ]/g,"_").replace(/\s+/g," ").trim().slice(0,60); }
  function baseName(key){ return (key||"").split("/").pop().replace(/^\d+-[a-z0-9]+-/i, ""); }
  function extFromType(t, key){
    t = t || "";
    if(/mp4/.test(t)) return "mp4"; if(/webm/.test(t)) return "webm"; if(/quicktime|mov/.test(t)) return "mov";
    if(/jpeg|jpg/.test(t)) return "jpg"; if(/png/.test(t)) return "png"; if(/gif/.test(t)) return "gif";
    const m = (key||"").match(/\.([a-z0-9]{2,4})$/i); return m ? m[1].toLowerCase() : "dat";
  }

  function triggerDownload(blob, filename){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  async function buildAndDownloadZip(photos, wishes, filename, btn){
    const prog = $("dlprogress");
    if(typeof JSZip === "undefined"){ prog.textContent = "Download tool didn't load — please refresh and try again."; return; }
    photos = photos || []; wishes = wishes || [];
    const withMedia = wishes.filter(w => w.mediaKey);
    const total = photos.length + withMedia.length;
    if(total === 0 && !wishes.length){ prog.textContent = "Nothing to download here yet."; return; }
    const label = btn ? btn.innerHTML : ""; if(btn){ btn.disabled = true; }
    const zip = new JSZip();
    const pf = zip.folder("photos-and-videos");
    const wf = zip.folder("well-wishes");
    let done = 0;
    const bump = () => { prog.textContent = "Gathering… " + Math.min(done, total) + " / " + total + " files"; };

    if(wishes.length){
      let txt = "Well Wishes for Juliana & Marko\r\n================================\r\n\r\n";
      wishes.forEach((w, i) => {
        txt += (i+1) + ". " + (w.name || "A guest") + "  (" + fmtDate(w.ts) + ")\r\n";
        if(w.message) txt += w.message + "\r\n";
        if(w.mediaKey) txt += "[video/photo attached — see the well-wishes folder]\r\n";
        txt += "\r\n";
      });
      wf.file("messages.txt", "﻿" + txt);
    }
    try {
      bump();
      for(let i=0;i<photos.length;i++){
        const blob = await fetch(fileUrl(photos[i].key)).then(r=>r.blob());
        pf.file(String(i+1).padStart(3,"0") + "-" + (baseName(photos[i].key) || ("file-"+(i+1))), blob); done++; bump();
      }
      for(let i=0;i<withMedia.length;i++){
        const w = withMedia[i];
        const blob = await fetch(fileUrl(w.mediaKey)).then(r=>r.blob());
        wf.file(String(i+1).padStart(2,"0") + "-" + (sanitizeName(w.name) || ("wish-"+(i+1))) + "." + extFromType(w.mediaType, w.mediaKey), blob); done++; bump();
      }
      prog.textContent = "Zipping it all up…";
      const out = await zip.generateAsync({ type:"blob" }, (meta) => { prog.textContent = "Zipping it all up… " + Math.round(meta.percent) + "%"; });
      triggerDownload(out, filename);
      prog.textContent = "Done! Your download should be starting 🤍";
    } catch(e){
      prog.textContent = "Something interrupted the download — please try again.";
    } finally {
      if(btn){ btn.disabled = false; btn.innerHTML = label; }
    }
  }

  function downloadAll(){ return buildAndDownloadZip(ALL_PHOTOS, ALL_WISHES, "juliana-marko-album.zip", $("downloadAll")); }

  async function downloadOne(key){
    const prog = $("dlprogress");
    try {
      prog.textContent = "Downloading…";
      const blob = await fetch(fileUrl(key)).then(r=>r.blob());
      triggerDownload(blob, baseName(key) || "photo");
      prog.textContent = "Saved 🤍";
    } catch(e){ prog.textContent = "Couldn't download that one — please try again."; }
  }

  /* ---- Select mode: pick specific items ---- */
  function updateSelCount(){
    const b = $("downloadSelected");
    b.textContent = "⬇ Download selected (" + selected.size + ")";
    b.disabled = selected.size === 0;
  }
  function setSelectMode(on){
    selectMode = on;
    $("grid").classList.toggle("selectmode", on);
    $("selectToggle").textContent = on ? "Cancel" : "Select";
    $("downloadSelected").style.display = on ? "" : "none";
    $("downloadAll").style.display = on ? "none" : "";
    if(!on){ selected.clear(); document.querySelectorAll(".tile.selected").forEach(t => t.classList.remove("selected")); }
    updateSelCount();
  }
  function toggleItem(key, tile){
    if(selected.has(key)){ selected.delete(key); tile.classList.remove("selected"); }
    else { selected.add(key); tile.classList.add("selected"); }
    updateSelCount();
  }
  async function downloadSelected(){
    if(selected.size === 0) return;
    const photos = (ALL_PHOTOS||[]).filter(p => selected.has(p.key));
    if(photos.length === 1){ return downloadOne(photos[0].key); }
    await buildAndDownloadZip(photos, [], "juliana-marko-selected.zip", $("downloadSelected"));
  }

  $("go").addEventListener("click", attempt);
  $("pw").addEventListener("keydown", e => { if(e.key === "Enter") attempt(); });
  $("refresh").addEventListener("click", () => loadAlbum().catch(e => alert(e.message)));
  $("downloadAll").addEventListener("click", downloadAll);
  $("selectToggle").addEventListener("click", () => setSelectMode(!selectMode));
  $("downloadSelected").addEventListener("click", downloadSelected);
</script>
</body>
